[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autosec-patch"
version = "0.1.0"
description = "Autonomous CVE Remediation and Regression Verification Agent powered by NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
authors = [{ name = "AutoSec Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "click>=8.0.0",
    "cryptography>=41.0.0",
    "eth-hash[pycryptodome]>=0.7.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
autosec = "autosec.cli:main"
climatetrust = "climatetrust.cli:main"
